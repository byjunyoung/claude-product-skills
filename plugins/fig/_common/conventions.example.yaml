# =============================================================================
# figma-conventions.yaml — shared config for the fig skills
#
# This file is the single source of truth for the rules. Skill bodies carry
# judgement, never values.
#
# The layers are merged, each overriding the one above. Write only the keys
# you need — anything you leave out falls back to the layer above.
#   1. this file                          bundled defaults (base)
#   2. ~/.claude/figma-conventions.yaml   your shared config
#   3. ./figma-conventions.yaml           per project (wins)
#
# In a new environment, /fig:setup reads the target file and drafts this for you.
# When you don't know a value, write null rather than deleting the key — null
# means "skip that check", while deleting brings the default back.
#
# A key you leave out still resolves — to this file's value. That is the point
# of a floor, and for most keys it is what you want. For the few that decide the
# shape of what a skill writes into somebody else's tool, it is not: the skill
# refuses rather than write a shape your team never chose, and names the key.
#
# Sharing this file across a team: keep it in a repository and symlink it into
# ~/.claude. Nothing here needs to change — the skills read where the file came
# from and say when your copy has fallen behind. /fig:setup wires that up.
#
# Report language follows meta.language below; the rules are read in English
# either way.
# =============================================================================

meta:
  profile: default          # name stamped on reports, so you know which config ran
  language: auto            # report language — auto | en | ko | any BCP-47 tag.
                            # auto follows the language you are talking in

# --- Naming -------------------------------------------------------------------
# lint uses frame_pattern / section_pattern verbatim as regexes.
# null turns that naming check off — which is what you want on a file that has
# no pattern at all, otherwise every frame is reported.
naming:
  frame: "{screen}-{state}"                   # human-readable form, for docs and previews
  frame_pattern: '^.+-[^-\s]+$'
  section: "NN. {domain} - {feature}"
  section_pattern: '^\d{2}\. .+$'
  states: [Default, Empty, Loading, Error, Validation, Selected]
  required_states:                            # per screen type. the type is judged from content
    list:   [Default, Empty, Loading, Error]
    form:   [Default, Validation]
    search: [Default, Empty]
  # Scaffolding node names — arrows writes them, lint and tokens treat them as exempt
  arrow_delimiter: " --> "
  state_chain_delimiter: " ~ "
  label_prefix: "[label] "
  state_chain_prefix: "[state] "
  # The page that holds one canonical copy of repeated states.
  # null means this file has no such convention.
  common_page_pattern: null                   # e.g. '^Common|^\[UI\] Common'
  common_frame_prefix: null                   # e.g. "Common-"
  # The page that holds this file's own composition patterns — how a list row is
  # built here, where a status badge sits inside it, what an empty panel looks
  # like. Neither of the two above it: the library holds the parts, the common
  # page holds one copy of a repeated state, and this holds the arrangement rule
  # between them. That rule is what drifts when two people draw the same kind of
  # thing a fortnight apart, each one internally fine.
  # null means the file has no such page, and /fig:draw then proposes defining
  # one rather than inventing a one-off.
  # File the patterns in sections, the same as any other page: the flow rules do
  # not apply to them (the audit knows to drop a pattern page from coverage), but
  # a frame sitting loose on a page is reported whatever the page is for.
  pattern_page_pattern: null                  # e.g. '^\[Pattern\]|^Patterns$'
  pattern_frame_prefix: null                  # e.g. "pattern/"

# --- Page roles ----------------------------------------------------------------
# Pages are sorted by name regex. An empty list means the file has no such tier.
pages:
  strict:   []                                # all rules apply        e.g. ['^\[UI\] ']
  free:     []                                # minimum rules only     e.g. ['^\[Update\] ']
  readonly: []                                # writes refused         e.g. ['^\[Archive\]']
  exclude_sections: []                        # sections exempt from audit  e.g. ['^Template$']
  protected_numbers: []                       # number bands renumbering must not touch  e.g. ["99"]

  # The three axes /fig:sync works on. null means sync asks you and you record
  # the answer here so it stops asking.
  # match has two forms —
  #   name    : pages whose name matches pattern
  #   divider : if a divider page (an empty page named `## label ##`) matches,
  #             every page from there to the next divider. For bands that names
  #             alone cannot capture
  canonical: null                             # the page everything is compared against
  archive:   null                             # applied work, already tidied away
  queue:     null                             # shipped by engineering, not yet in canonical

# --- Layout tokens -------------------------------------------------------------
# These are measured off a file, so they ship with no default. /fig:setup
# observes and fills them — shipping one team's spacing as a default makes
# every frame in someone else's file report as a violation.
layout:
  column_grid:          null                  # horizontal pitch between screens
  section_padding:      null
  frame_gap:            null
  section_gap_same_row: null
  domain_row_gap:       null
  section_resize_margin: null                 # min and max padding around content bbox on resize
  # The two below are tuning knobs rather than measurements, so they do have defaults
  row_bucket: 1000                            # rounding unit for deciding what shares a row
  reference_frame_width: 1440                 # screen width the arrow defaults assume

# --- Section style -------------------------------------------------------------
# Every section looks the same. Color is never used to tell sections apart.
section_style:
  fill: "#6B7280"        # neutral default — swap in your own. /fig:setup reads it off the file
  fill_opacity: 0.04
  stroke: "#6B7280"
  stroke_weight: 1
  stroke_align: INSIDE
  dash: [20, 20]
  corner_radius: 72

# --- Placeholder style ---------------------------------------------------------
placeholder_style:
  fill: "#FAFAFB"
  stroke: "#B3B3BF"
  stroke_weight: 2
  dash: [10, 8]
  font: { family: Inter, style: Regular, size: 28 }
  text_color: "#73787F"
  text_prefix: "Placeholder — "

# --- Flow arrows ---------------------------------------------------------------
# If the page already has arrows, their stroke is read and followed; these
# values are only used when there are none.
arrows:
  color: "#4A5463"
  stroke_weight: 3
  dash_conditional: [12, 8]                   # conditional flows and state chains alike
  head_gap: 12                                # between the arrowhead and the target edge
  trunk: 120                                  # how far a branch trunk runs before splitting
  trunk_to_target_min: 240                    # minimum trunk-to-target gap, to leave room for a label
  parallel_offset: 24                         # offset when two arrows join the same pair of frames
  cap: { start: ROUND, end: ARROW_EQUILATERAL }
  label:
    font: { family: Inter, style: Medium, size: 20 }
    padding: [10, 5]                          # horizontal · vertical
    corner_radius: 8
    fill: "#FFFFFF"
    stroke: "#D9DBE3"
    text_color: "#59616E"
    offset_from_target: [36, 60]              # the band above the target edge where labels sit
  audit:                                      # tolerances for the geometry audit
    edge_tolerance: 2                         # px the start point may drift off the source edge
    gap_range: [9, 15]                        # accepted range for head_gap
    label_clear: 30                           # minimum clearance between a label and an arrowhead

# --- Component default audit ---------------------------------------------------
# The convention comes from how the same file actually uses a component,
# not from a written rule.
component_audit:
  min_samples: 5                              # below this, no convention is inferred
  dominance: 0.9                              # only properties this lopsided count as convention
  body_offset: { left: 270, top: 120 }        # shared chrome (nav width, top bar height) — exempt

# --- Design system -------------------------------------------------------------
design_system:
  library: auto                               # auto = detect the library the file is connected to
  token_prefixes: []                          # token groups to look up  e.g. ["fill/", "border/", "icon/"]
  match_threshold_channel: 8                  # max channel delta still counted as "the same color"

# --- Canonical sync ------------------------------------------------------------
sync:
  pair_patterns:                              # section names that form a comparison pair
    to_be: 'to.?be|after'
    as_is: 'as.?is|before|current'
  text_diff_max_len: 40                       # strings longer than this are not used as diff keys
  version_page_pattern: null                  # e.g. '^\[Update\] v[\d.]+'
  named_version: null                         # title of the version saved after apply. null saves none — the default,
                                              # because saveVersionHistoryAsync is not exposed to use_figma (see handoff below)

# --- Handoff signals -----------------------------------------------------------
# The signals Figma itself shows engineering, set at the end of the skills that earn them:
# /fig:prep marks a section ready for dev once /fig:lint passes it; /fig:sync marks it
# completed once the change is in canonical. Off, both are left alone.
#
# Off is the default, and not out of caution: use_figma rejects both the getter and the
# setter with `"devStatus" is not a supported API`, on an Edit seat as much as a View one
# (checked on a live file, 2026-08-31). Figma's REST API reads the status but has nothing
# that sets it. Until the tool exposes it, on means every run fails at the write.
handoff:
  dev_status: false                           # Dev Mode status on sections — READY_FOR_DEV after prep, COMPLETED after sync
  ready_note: "prep · {date}"                 # the note carried on a READY_FOR_DEV status

  # --- The moment a handover points at -------------------------------------------
  # A handover has to name a moment in the file. Without one, "matches the design"
  # moves as soon as somebody edits it again, and a ticket leaning on that line is
  # checking against a target that shifted after it was written.
  #
  # Figma's own named versions are that moment — a file-level snapshot a deeplink
  # pins with version-id — so nothing is copied and no frozen duplicate exists.
  # Saving one is done by hand: use_figma's allowlist rejects the version API the
  # same way it rejects devStatus (checked on a live file, 2026-08-31). The skill
  # asks, the person saves, the skill reads it back.
  version:
    enabled: false                            # true where your handovers pin a version
    name:  "{release} handover"               # what the person types into Figma's version history
    match: '^(.+) handover$'                  # picks handovers out of the autosaves. group 1 is the release
    ref:   "{label} · {date}"                 # how it is written into the task doc and the ticket

# --- Task tracker --------------------------------------------------------------
# With none, /fig:diff stops at the Figma annotations and emits the table as markdown.
task_tracker:
  type: none                                  # notion | github | none
  ref: null                                   # database id, repo name, and so on
  ui_section_heading: null                    # heading in the doc where changes are written up
  annotation_category: "Changed"              # a shared category to reuse. never create new ones
  scope_tags: []                              # classification tags prefixed to labels

# --- Presentation decks (/fig:deck · /fig:deck-setup) ---------------------------
# Template values — colors, type, coordinates, archetypes — do not belong here.
# /fig:deck-setup measures your team template into assets_dir as template-spec.md
# and template.js. Those assets stay local: template backgrounds usually carry a
# company wordmark, which must never ship inside a plugin.
deck:
  assets_dir: "./deck-assets"   # use ~/.claude/deck-assets if several projects share a template
  template_file: null           # Slides file key of the team template. null means setup asks
  # Archetype fidelity. A template is a menu, so the more archetypes you draw
  # from, the more title positions scatter across the deck.
  #   title-unified       keep each archetype's coordinates, but allow one title family
  #   archetype-original  every archetype as-is. content tops landing on several values is expected
  fidelity: title-unified
  batch_size: 4                 # slides built per use_figma call

# --- QA (/fig:qa) --------------------------------------------------------------
# Audit against a plan of record. Labels and field names are whatever your bug
# tracker calls them — change them here and reports come out in those words.
qa:
  # Where the basis for a judgement is found. null skips that collection.
  baseline:
    prd:    null                              # spec location, e.g. a page id or collection url
    design: figma                             # design source — figma | none
    tasks:  null                              # task tracker, for past decisions and reversals

  severity:  [Critical, High, Medium, Low]    # worst first
  frequency: [Always, Sometimes, Once]

  # Fields written per defect. Match your bug report form one to one.
  report_fields: [Severity, Frequency, Steps, Expected, Actual, Evidence]

  environments: {}                            # name → url, e.g. dev: "https://dev.example.com"
  allow_write: false                          # even when true, creates and deletes are confirmed each time

# --- Tools ---------------------------------------------------------------------
tools:
  figma_token_env: FIGMA_TOKEN                # env var holding the PAT, for REST paths
  frame_count_guard: 20                       # above this many frames, confirm before collecting screenshots
  proto_output_dir: "."                       # where working prototypes are written
  proto_publish:                              # an unset repo stays local and never offers to publish
    repo: null                                # <owner>/<repo>
    account: null                             # gh keyring name, which can differ from the login
    local: null                               # working copy the file is placed into
    visibility: private                       # public puts the screen behind a URL anyone can hold
    pages_url: null                           # where the published file is read back from
    landing: index.html                       # the file holding the project cards

# --- Guide source (optional) ---------------------------------------------------
# If your team keeps a written guide, point at it here. It is not fetched on
# every run — /fig:setup absorbs it once to help fill the values above.
guide_source:
  type: none                                  # notion | file | url | none
  ref: null

# --- Per-file overrides --------------------------------------------------------
# Everything above is the default; values written here under a fileKey override
# it for that file only (deep merge). Put things that genuinely differ per file
# here — the three sync axes are the usual case.
# fileKey is the value in figma.com/design/<fileKey>/...
files: {}
#  "AbCdEf123456":
#    label: "Product A design file"       # name used in reports
#    pages:
#      canonical: { match: name,    pattern: '^\[UI\] ' }
#      archive:   { match: name,    pattern: '^\[Update\] ' }
#      queue:     { match: divider, pattern: 'shipped to dev' }
