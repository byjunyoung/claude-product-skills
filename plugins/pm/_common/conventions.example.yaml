# =============================================================================
# pm-conventions.yaml — shared config for the pm skills
#
# This file is the single source of truth for the rules. Skill bodies carry
# judgement, never values.
#
# The layers are merged, each overriding the one above. Write only the keys
# you need — anything you leave out falls back to the layer above.
#   1. this file                       bundled defaults (base)
#   2. ~/.claude/pm-conventions.yaml   your shared config
#   3. ./pm-conventions.yaml           per project (wins)
#
# When you don't know a value, write null rather than deleting the key — null
# means "skip that", while deleting brings the default back.
#
# A key you leave out still resolves — to this file's value. That is the point
# of a floor, and for most keys it is what you want. For the few that decide the
# shape of what a skill writes into somebody else's tool, it is not: the skill
# refuses rather than write a shape your team never chose, and names the key.
# Those keys are marked below.
#
# Sharing this file across a team: keep it in a repository and symlink it into
# ~/.claude. Nothing here needs to change — the skills read where the file came
# from and say when your copy has fallen behind. /pm:setup wires that up.
# =============================================================================

meta:
  profile: default          # name stamped on reports, so you know which config ran
  language: auto            # document and report language — auto | en | ko | any BCP-47 tag.
                            # auto follows the language you are talking in

# --- PRD -----------------------------------------------------------------------
prd:
  # Where the document lives. The structure below is identical either way;
  # only publishing differs.
  #   markdown  local files. the default — needs no other tooling
  #   git       writes markdown, then a branch and a PR
  #   notion    Notion pages. requires the notion section to be filled in
  target: markdown

  # --- Structure. The same wherever the doc is published -------------------------
  structure:
    sections: [Overview, Requirements, Linked tasks, Design, Change log]
    overview: [One-line definition, Background, Core value, Goals and scope, User groups]

    # Rows written for each user group. Leave a row as TBD rather than filling
    # it in without evidence.
    user_group_rows: [Account and access, Environment, Primary domains, Key scenario,
                      Pain points, Expectations, Evidence, TBD]

    # Sections inside a feature entry. Behaviour goes in a table (action, given, when, then).
    feature_sections: [Background, Core requirement, Behaviour, States and cases, Rules and exceptions, References]
    policy_sections:  [Background, Rules, References]

    # Fixed rows of the states table. Use '—' when a row does not apply,
    # 'Other' for anything outside the list. These are the shapes any screen can
    # be in, the same list in every document. A product's own states — what a
    # machine, a screen or an order is in right now — are not these: they belong
    # in one policy entry, and the entries using those names are read against it.
    cases: [Normal, Empty, Loading, Error, No permission]

  # --- Entry properties. Use the words your team actually uses --------------------
  properties:
    type:     [Feature, Policy]
    status:   [Draft, Live, Needs update, Planned, Archived]
    priority: [Core, Important, Nice-to-have]

  # --- Writing rules -------------------------------------------------------------
  # The list that keeps a product doc from turning into an engineering doc.
  # Anything here appearing in the body is rejected at verification. The rule
  # behind it: write *what* is required, and leave *how* to engineering.
  # It reads names and nothing else. A sentence carrying none of these words can
  # still describe the machine rather than the product, so the skill reads the
  # sentences separately — that half is a judgement and has no list behind it.
  forbidden_terms: [API, endpoint, websocket, polling, payload, token, JWT, OAuth,
                    schema, migration, cache]
  # Only for what genuinely cannot be settled. Attaching this to something the
  # material could have decided fails verification.
  tbd_label:        "TBD"
  assumption_label: "(assumed)"
  emoji:            false        # whether emoji are allowed in the body

  # --- Splitting into domains ----------------------------------------------------
  domains:
    range: [5, 7]                # how many to aim for. they must not overlap
    align_with_design: true      # whether to match the design file's page structure one to one

  # --- Precedent, for a feature entry the first time it is drafted ---------------
  # What this team already decided (1.3) always outranks whatever this turns up.
  precedent:
    enabled: true                 # whether a new feature entry gets checked at all
    archive_dir: null             # a local research archive to check before the web, if you keep one

  # --- target: markdown | git ----------------------------------------------------
  markdown:
    dir: "./docs/prd"            # where documents go
    front_matter: true           # whether to prepend title, status and updated date
    split: product               # product = one file per product / domain = one per domain
  git:
    branch_prefix: "prd/"        # branch prefix when target is git
    open_pr: true

  # --- target: notion ------------------------------------------------------------
  # null skips that lookup or link. Inline database schemas are not changed per document.
  notion:
    template:      null          # page id of the standard format to duplicate
    inline_db:
      users:       null          # user groups
      features:    null          # features and policies
    task_db:       null          # linked tasks
    heading_style: '{color="gray_bg"}'
    reference_docs: []           # existing docs to follow for tone and format

# --- Sources -------------------------------------------------------------------
# Draft quality scales with how much material goes in. Turn off what you don't use.
sources:
  design: true                   # design files
  repo:   true                   # code and design documents
  docs:   true                   # document tools such as Notion
  chat:   true                   # chat history
  # Which tool each of these is. The calls live in sources/<type>.md — slack and
  # google ship; any other name needs an adapter you draft (see adapters below).
  chat_type:     slack           # the chat tool /pm:task-draft and /pm:log read. none skips chat
  calendar_type: google          # the calendar /pm:log reads. none skips it

# --- Adapters ------------------------------------------------------------------
# The calls for one tool live in one file, named by the type the config uses —
# trackers/<type>.md for a task tracker, sources/<type>.md for chat or a calendar.
# The bundled ones ship inside the plugin. Yours live outside it, so an update does
# not overwrite them; later dirs cover earlier, like the config layers. /pm:setup
# drafts one for a tool it has never seen, from the tools connected on this machine.
adapters:
  dirs: ["~/.claude/pm-adapters", "./pm-adapters"]

# --- Tasks (/pm:task-draft, /pm:task-publish, /pm:task-sync) --------------------
# A task can live in one place or two. Teams that plan in one tool and build in
# another keep both; a single-tracker team sets `mirror.type: none` and the sync
# skill has nothing to reconcile, which is the correct answer rather than an error.
task:
  record:                        # where the planning-side task lives
    type: notion                 # any type whose adapter answers as a record — notion and markdown ship. none = no tracker
    ref:  null                   # a collection:// url, an owner/repo, or a directory
  mirror:                        # the engineering-side copy, if there is one
    type: none                   # any type whose adapter answers as a mirror — github ships. none = one tracker
    ref:  null

  # The single source of truth for matching the two sides. Name the property on the
  # record that holds the mirror's url. A back-link written in the mirror's body is
  # NOT used — it can point at a source that was already discarded, which is how
  # duplicates and resurrected tickets happen.
  link_property: null

  # --- The rule document the tracker is governed by ------------------------------
  # Some trackers are run by written conventions of their own — what may carry a
  # version, who may close what, how long a parked ticket keeps its place. Those
  # rules outrank everything in this file, and they change without this file being
  # told. Name the document here and the skills read it once per session, before the
  # first write, rather than acting on a copy of it that quietly went stale.
  #
  # A URL is enough where the doc is public. Where it is not, the mirror's adapter
  # says how to fetch it — that is the side that already holds the credentials.
  policy:
    doc: null                    # e.g. "https://github.com/{org}/{repo}/blob/main/docs/ticket-policy.md"

  # --- The ticket skeleton the tracker already publishes --------------------------
  # Most trackers let a team publish the shape a ticket is filed on, and everyone who
  # files by hand gets it. A skill that writes headings of its own instead produces a
  # ticket shaped unlike every neighbour, and the sections it invented are the ones
  # nobody afterwards maintains. Name the template and its headings are the skeleton,
  # read at run time — a template edited this morning is the one used this afternoon.
  #
  # This does not replace the section names further down. Those say which slot is
  # which; the template says which sections exist and in what order. Where a name
  # configured below is not in the template, one of the two has gone stale and the run
  # says which rather than writing a second section beside the first — that silent
  # doubling is the whole reason this key exists.
  #
  # A url is enough where the template is public; where it is not, the mirror's adapter
  # says how to fetch it. Null means the tracker publishes none and the names below
  # decide alone, which is what every run did before this key existed.
  template:
    task:   null                 # e.g. ".github/ISSUE_TEMPLATE/task.md", or its url
    parent: null                 # the template for whatever hierarchy.parent_kind names

  # --- The context table written into a task record ------------------------------
  # Rename these to whatever your team actually asks. Order is the order written.
  context_rows: [Request source, Initial request, Background (AS-IS),
                 Goal (TO-BE), Scope In, Scope Out, Undecided]

  # A context table is scanned, not read. These keep the cells from turning into prose.
  cell:
    max_chars:    30             # roughly one line per item
    owner_marker: "—"            # how an owner is appended, e.g. "confirm — engineering"
    bullet:       "·"

  labels:
    assumption: "(assumed)"      # marks your inference, so it never reads as a found fact
    tbd:        "TBD"            # marks what nobody has decided yet

  # --- Record properties. Use the words your tracker uses ------------------------
  properties:
    status_initial: null         # the status a new record starts in
    priority: [low, medium, high, critical]
    projects: []                 # select options; empty means ask each time
    default_assignee: null       # id of whoever owns a task by default
    # --- how far along, and when ------------------------------------------------
    # The record's own progress and schedule properties. Null means the record does
    # not carry one, and that diagnosis is skipped rather than guessed at.
    progress: null               # a 0-1 ratio or a percent
    start:    null               # when work actually began
    end:      null               # when the last done condition was ticked
    # --- which release, owned by the mirror ------------------------------------
    # A copy of the milestone the task's ticket sits under, read at the level
    # hierarchy.milestone_on names. Filled from the tracker, never decided here.
    # Null means the record carries no version and nothing reads or writes one.
    version:       null          # e.g. "Target Version"
    version_unset: null          # what an open task with no milestone shows, e.g. "Unset".
                                 # Null leaves it blank. A closed task that never had a ticket
                                 # stays blank either way — a placeholder on finished work
                                 # reads as a decision still pending

  # What a progress figure is counted from. `contract` = the ticked fraction of the
  # contract checklist, the only number neither side has to invent. Null turns the
  # progress and schedule diagnoses off wherever they would otherwise run.
  progress_source: contract

  # Record status -> the mirror column a task is seated in when it is first filed.
  # Only the statuses a task can be filed *in* need an entry; a status with none leaves
  # the mirror's own default alone. This also tells /pm:task-sync which column counts as
  # the backlog. Seating is not ownership — field_owner.status still decides who wins later.
  status_map: {}

  # --- How a task sits under something bigger in the mirror ----------------------
  # null parent_kind means a flat list, which is the common case.
  hierarchy:
    parent_kind:   null          # Epic, Project, Milestone — whatever your tracker calls it
    parent_title:  null          # e.g. "[EPIC] [{group}] {name}"
    parent_required: true        # false where the tracker accepts a task with no parent —
                                 # a one-off fix, a ticket a merge opened by itself. Forcing
                                 # a parent onto those is what breeds the empty umbrella
                                 # ticket everything then hangs under
    milestone_on:  none          # parent | task | none — which level carries a milestone
    milestone_format: null       # e.g. "{project} YYYY-MM". Where the milestone axis differs
                                 # by project — one on a month, another on a release version —
                                 # write a map keyed by project name instead of one string, and
                                 # key it by the name the tracker shows, not the doc's own.
                                 # A project in milestone_projects with no entry here still
                                 # uses milestones: the ones already open are offered and none
                                 # is created, which is the honest answer where another team
                                 # owns that project's naming
    milestone_projects: []       # projects that use milestones; empty means none do

  # --- Which side wins, per field ------------------------------------------------
  # Sync never guesses. A field not listed here is reported as a difference and left alone.
  field_owner:
    title:    record
    status:   mirror
    assignee: record
    version:  mirror             # the milestone, copied into properties.version where that is named

  # --- Mapping between the two sides ---------------------------------------------
  # Left is what the record says, right is what the mirror calls it. A record value
  # with no entry here is NOT mirrored — the skill stops and says so rather than
  # inventing a label, because a wrong label is harder to find than a missing ticket.
  label_map:
    project:  {}                 # record project -> mirror label
    priority: {}                 # record priority -> mirror label
  assignee_map: {}               # record user id -> mirror username

  # --- The ticket written in the mirror ------------------------------------------
  # The detail stays in the record and the ticket links to it, so there is one place
  # to edit and no second copy to drift. Two sections are the exception: the done
  # conditions and the QA checklist have no copy on the record side, because they are
  # the contract the work is finished against and the boxes are ticked in the mirror.
  ticket:
    title: "[Task] [{group}] {name}"
    default_labels: []           # labels every task gets, e.g. a type label

    # The heading each slot is written under, in the order written here. A slot set
    # to null is dropped. The keys are fixed, the names are yours — rename a section
    # without the skill losing track of which slot it is.
    sections:
      project:  "Project / version"
      summary:  "Summary"
      done:     "Definition of done"
      links:    "Spec and design"
      schedule: "Schedule"

    link_rows:                   # what appears under the task's links slot. null drops that row
      spec:    null              # at contract.level parent these live on the parent instead
      design:  null
      version: null
      record:  "Change summary"

    # A task's own completion — what the person holding it has to produce. This is not
    # the contract: the contract says the feature behaves correctly, a task's done
    # conditions say this slice of work is finished. They do not overlap, and a task
    # whose done conditions restate the contract is the copy this design avoids.
    #
    # Where a kind of task always produces the same artefacts, list them here and a
    # draft starts from them instead of an empty section. Lines that do not apply are
    # dropped at the preview rather than left in.
    done_defaults: []            # e.g. ["the spec entry is updated",
                                 #       "the screens and states are drawn and handed over",
                                 #       "the parent's links section is updated"]

  # --- The contract ---------------------------------------------------------------
  # Two sections decide when work is finished: what has to be true, and how somebody
  # confirms it. They are not a copy of anything — the boxes are ticked where
  # engineering works, so that is where they live, and the record keeps the context
  # instead.
  #
  # Which level carries them is a real choice. On the task, where each piece is filed
  # and closed. On the parent, where the whole feature is reviewed. Put them wherever
  # review happens: a condition and the step confirming it, split across two tickets,
  # cannot be checked against each other, and the coverage rule stops meaning anything.
  contract:
    # Marked: a skill will not write a contract on this key inherited. Which ticket
    # carries the binding sections changes what lands in your tracker, and a default
    # nobody chose is not an answer to that — /pm:task-publish stops and names it.
    level: task                # task | parent | none — none turns the contract off

    # Headings for the sections, written in the order this map is written — a tracker
    # whose template already orders them differently is followed rather than argued
    # with. At level task they are the task's own done and QA sections and
    # ticket.sections.done is dropped, since there is only one.
    sections:
      requirements: null         # what the work has to do, as against when it is done.
                                 # Set it where the tracker's template carries the two
                                 # apart; it holds pointers into the spec, never a copy
                                 # of it
      done:  "Definition of done"
      qa:    "QA checklist"
      links: null                # where the contract's level also carries the shared
                                 # links. null leaves that section alone
    link_rows:                   # rows written under contract.sections.links
      spec:   "Spec"
      design: "Design"

    # The contract decides when work is finished. A ticket can still be filed before
    # it exists — a board needs the row, a parent needs its child — but it has to say
    # so rather than look finished. With this false the preview asks before taking
    # that path; with it true it is taken without asking.
    allow_tbd: false

    # How a ticket filed that way says so. Written under the done heading in place of
    # items, as a quote rather than a checkbox — a checkbox invites ticking, and that
    # is how "TBD" came to mean nothing. {missing} is filled from what the coverage
    # pass could not settle, {date} from today. Say in the note that the QA section
    # follows too; its heading is not written.
    incomplete_note: null    # e.g. "not settled — written before work starts. missing: {missing} (filed {date})"

    # A label carrying the same fact, so the whole set is one filter away instead of a
    # search through bodies. It has to already exist in the tracker — this skill never
    # creates one, and a tracker whose own conventions are trimming unread labels is a
    # reason to leave this null and rely on the column the ticket sits in.
    incomplete_label: null   # e.g. "status: needs-spec"

    # Appended to the done conditions where the design side handed something over and
    # appearance is settled by looking at the design rather than by a sentence.
    #
    # {version} is the pinned version's label. It goes INSIDE the sentence rather than
    # on a line of its own: the condition then reads as a verdict somebody can reach
    # without looking elsewhere, and the list stays checkboxes with nothing else mixed
    # in. Without a pin the line points at a moving target, so leave this null where
    # your design side does not hand over pinned versions.
    design_match_line: null  # e.g. "the build matches the {version} design"

    # The QA step that checks the line above — one per screen, not one listing every
    # screen. A single step is confirmed by a glance, and an enumeration inside one
    # checkbox is still one tick: the reader looks at the list rather than at the
    # screens. One box per screen makes the screen nobody opened visible as the box
    # nobody ticked. {screen} is the frame's name, {version} the pinned label.
    design_match_step: null  # e.g. "compare {screen} against the {version} design"

    # Above this many comparison steps, the preview offers to split the ticket. The
    # screens are the work; the ticket is what got too big. Null means no ceiling.
    design_match_max: null   # e.g. 12

  # --- Whatever your tracker needs and no other does -----------------------------
  # Board ids, custom field ids, issue-type ids. Written once, read back verbatim.
  # Nothing here is interpreted, so a tracker this plugin has never seen still works.
  # A github board, for example, needs these — every one of them is an id no screen
  # shows you, which is why /pm:setup queries them for you:
  #   project_number, project_owner, project_node_id
  #   project_field_id, project_field_options: {label: option id}
  #   status_field_id,  status_field_options:  {column name: option id}
  #   start_date_field, end_date_field, epic_issue_type
  mirror_extras: {}

  notion:
    body_template: null          # page id whose body is copied into a new record

# --- Daily log (/pm:log, /pm:log-review) ----------------------------------------
# A day's record, assembled from the tracker plus whatever else you name here.
# The tracker itself comes from task.record above and is not repeated.
#
# Two layers. The daily file captures facts and evidence with nobody watching;
# the review turns a period of them into statements you can reuse, and asks you
# the things a file cannot know. Do not try to make the daily run do the second
# job — an unattended agent writing about its own significance is how a log
# fills with sentences nobody can check later.
log:
  enabled: false               # off by default. turn it on where you keep a log
  out:
    dir: "./logs"              # written as <dir>/YYYY/MM/YYYY-MM-DD.md
    front_matter: [date, tasks_mine, tasks_others, meetings, completed, sources]
                               # completed is an index of title and url, not prose
  me:
    tracker_user_id: null      # your id in the record tracker. tells your rows from the team's
  people: {}                   # tracker user id -> display name, for the team section
  sections: [What I did, Meetings, My tasks, Team tasks (reference),
             Decisions, What others said, Evidence, Notes, Follow-ups, Tomorrow]
  empty_line: "- Nothing of note"   # what a section with nothing in it says
  sources:
    calendar: null             # calendar id, or null to skip
    chat_channels: []          # channel ids to read for the day
    notes_channel: null        # where you type notes to yourself — meetings, memos.
                               # a channel only you write in, so nothing has to be tagged
    notes_exclude_apps: []     # user ids of apps that post there on your behalf.
                               # their output is not something you wrote
  backfill:
    business_days: 3           # how many past days to re-check for gaps

  # --- The periodic write-up (/pm:log-review) -----------------------------------
  review:
    out: "./highlights/{YYYY}.md"    # accumulating document. {YYYY} is the period's year
    sections: [Projects, Collaboration and mentoring, Design and documentation,
               What I learned, Feedback received, Company building]
    max_items: 6               # how many to interview about. the rest are listed, not asked
    sentence: xyz              # xyz = accomplished X as measured by Y by doing Z
                               # plain = what was done and what changed
    unknown_metric: "metric unconfirmed"   # stands in where you had no figure to give
